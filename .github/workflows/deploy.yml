# NAS Snowflake deployment workflow
#
# Automatic promotion:
#   - release/* -> UAT deployment (GitHub Environment approval).
# Production promotion:
#   - Manually run this workflow from a release branch and provide
#     the exact commit SHA that passed UAT. PROD Environment approval is required.
#
# DEV is deployed by ci-validation.yml. This workflow deliberately does not
# deploy develop, preventing two workflows from applying the same DEV migrations.
# Deployment metadata is written to NAS_ADMIN.SCHEMACHANGE.DEPLOYMENT_AUDIT.

name: NAS Snowflake Schemachange Deployment

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact commit SHA successfully deployed to UAT
        required: true
        type: string
      dry_run:
        description: Preview pending migrations without executing them
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: snowflake-deploy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repository-validation:
    name: Validate deployment commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Validate YAML, configs and migration naming
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          files = (list(Path("config").glob("*.yml")) + list(Path(".github/workflows").glob("*.yml")))
          if not files:
              raise SystemExit("No YAML files found")
          for path in files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"Valid YAML: {path}")

          required = [Path("config/dev.yml"), Path("config/uat.yml"), Path("config/prod.yml")]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f"Missing config files: {missing}")

          migrations = sorted(Path("migrations").rglob("*.sql"))
          if not migrations:
              raise SystemExit("No deployment SQL found under migrations/")
          versions = set()
          for path in migrations:
              if path.name.startswith("V"):
                  match = re.match(r"^V([^_]+)__.+\.sql$", path.name)
                  if not match:
                      raise SystemExit(f"Invalid versioned migration: {path}")
                  if match.group(1) in versions:
                      raise SystemExit(f"Duplicate migration version: {match.group(1)}")
                  versions.add(match.group(1))
              elif not re.match(r"^[RA]__.+\.sql$", path.name):
                  raise SystemExit(f"Invalid migration filename: {path}")
          print(f"Validated {len(migrations)} migration(s)")
          PY

  resolve-target:
    name: Resolve deployment target and commit
    needs: repository-validation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Resolve target
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET_ENV="PROD"
            DEPLOY_SHA="$INPUT_RELEASE_COMMIT"
          else
            case "$SOURCE_BRANCH" in
              release/*) TARGET_ENV="UAT" ;;
              *) echo "::error::Unsupported source branch: $SOURCE_BRANCH"; exit 1 ;;
            esac
            DEPLOY_SHA="$GITHUB_SHA"
          fi

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::A full 40-character commit SHA is required."
            exit 1
          fi
          echo "target_environment=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy migrations to ${{ needs.resolve-target.outputs.target_environment }}
    needs: resolve-target
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-target.outputs.target_environment }}
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange==4.2.0

      - name: Select environment configuration
        id: config
        shell: bash
        run: |
          case "${{ needs.resolve-target.outputs.target_environment }}" in
            DEV)  echo "config_file=config/dev.yml" >> "$GITHUB_OUTPUT" ;;
            UAT)  echo "config_file=config/uat.yml" >> "$GITHUB_OUTPUT" ;;
            PROD) echo "config_file=config/prod.yml" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unsupported environment"; exit 1 ;;
          esac

      - name: Validate required Snowflake environment variables
        shell: bash
        run: |
          set -euo pipefail
          for variable in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_ROLE SNOWFLAKE_WAREHOUSE; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::$variable is not configured in the selected GitHub Environment."
              exit 1
            fi
          done
          echo "Required Snowflake connection variables are configured."

      - name: Write Snowflake private key from GitHub Environment secret
        id: write-private-key
        env:
          SNOWFLAKE_PRIVATE_KEY_P8: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SNOWFLAKE_PRIVATE_KEY_P8:-}" ]]; then
            echo "::error::GitHub Environment secret SNOWFLAKE_PRIVATE_KEY_P8 is missing."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/snowflake_deploy_key.p8"
          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY_P8" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "key_file_ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify Schemachange configuration
        run: schemachange verify --config-file-name "${{ steps.config.outputs.config_file }}"

      - name: Preview pending migrations
        run: |
          schemachange deploy \
            --config-file-name "${{ steps.config.outputs.config_file }}" \
            --dry-run

      - name: Execute pending migrations
        id: execute-migrations
        if: github.event_name == 'push' || inputs.dry_run == false
        run: schemachange deploy --config-file-name "${{ steps.config.outputs.config_file }}"

      - name: Record deployment audit in Snowflake
        if: always() && steps.write-private-key.outputs.key_file_ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-target.outputs.target_environment }}
          DEPLOY_COMMIT_SHA: ${{ needs.resolve-target.outputs.deploy_sha }}
          DEPLOY_SOURCE_BRANCH: ${{ github.ref_name }}
          DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'DRY_RUN' || 'EXECUTE' }}
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: python scripts/write_deployment_audit.py

      - name: Clean up temporary private key
        if: always()
        shell: bash
        run: |
          if [[ -n "${SNOWFLAKE_PRIVATE_KEY_FILE:-}" && -f "$SNOWFLAKE_PRIVATE_KEY_FILE" ]]; then
            shred -u "$SNOWFLAKE_PRIVATE_KEY_FILE" || rm -f "$SNOWFLAKE_PRIVATE_KEY_FILE"
          fi
