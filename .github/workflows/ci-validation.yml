
# NAS Snowflake CI validation
#
# develop: validate, verify, dry-run and deploy to DEV.
# release/*: repository validation runs here; deploy.yml handles UAT.
# hotfix/*: repository validation runs here; deploy.yml handles direct PROD.
# main: repository validation runs here; deploy.yml handles PROD promotion.

name: NAS Snowflake CI Validation

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
      - 'Release/**'
      - 'hotfix/**'
      - 'Hotfix/**'

  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'Release/**'
      - 'hotfix/**'
      - 'Hotfix/**'

permissions:
  contents: read
  pull-requests: read
  actions: read

# Prevent two DEV deployment runs from querying the same time window at once.
concurrency:
  group: nas-snowflake-dev-deployment
  cancel-in-progress: false

jobs:

  repository-validation:
    name: Repository and migration validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Validate YAML, configurations and migration structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          yaml_files = (
              list(Path("config").glob("*.yml"))
              + list(Path(".github/workflows").glob("*.yml"))
          )

          if not yaml_files:
              raise SystemExit(
                  "No YAML configuration or workflow files found."
              )

          for path in yaml_files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"Valid YAML: {path}")

          required_configs = {
              Path("config/dev.yml"),
              Path("config/uat.yml"),
              Path("config/prod.yml"),
          }

          missing = [
              str(path)
              for path in required_configs
              if not path.is_file()
          ]

          if missing:
              raise SystemExit(
                  f"Missing environment configuration(s): {missing}"
              )

          migration_files = sorted(Path("migrations").rglob("*.sql"))

          if not migration_files:
              raise SystemExit(
                  "No deployment SQL found under migrations/"
              )

          versions = set()

          for path in migration_files:
              if path.name.startswith("V"):
                  match = re.match(
                      r"^V([0-9]+)__[a-z0-9_]+\.sql$",
                      path.name
                  )

                  if not match:
                      raise SystemExit(
                          f"Invalid versioned migration filename: {path}"
                      )

                  version = match.group(1)

                  if version in versions:
                      raise SystemExit(
                          f"Duplicate migration version: {version}"
                      )

                  versions.add(version)

              elif path.name.startswith(("R__", "A__")):
                  if not re.match(
                      r"^[RA]__[a-z0-9_]+\.sql$",
                      path.name
                  ):
                      raise SystemExit(
                          f"Invalid repeatable/always migration filename: {path}"
                      )

              else:
                  raise SystemExit(
                      f"Unsupported migration prefix in {path}; "
                      "expected V, R__ or A__."
                  )

          working_files = list(Path("sql_scripts").rglob("*.sql"))

          print(
              f"Validated {len(migration_files)} deployment migration(s)."
          )
          print(
              f"Found {len(working_files)} working/admin SQL script(s); "
              "sql_scripts/ is not deployed."
          )
          PY

  dev-schemachange-preflight:
    name: DEV Schemachange deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: repository-validation
    runs-on: ubuntu-latest

    environment:
      name: DEV

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Checkout merged develop commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Schemachange and Snowflake connector
        run: |
          python -m pip install --upgrade pip
          pip install schemachange==4.2.0 snowflake-connector-python

      - name: Write DEV private key from GitHub Environment secret
        id: write-dev-key
        env:
          SNOWFLAKE_PRIVATE_KEY_P8: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SNOWFLAKE_PRIVATE_KEY_P8:-}" ]]; then
            echo "::error::DEV GitHub Environment secret SNOWFLAKE_PRIVATE_KEY_P8 is missing."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/snowflake_deploy_key.p8"

          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY_P8" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "key_file_ready=true" >> "$GITHUB_OUTPUT"

      - name: Create deployment ID
        shell: bash
        run: |
          DEPLOYMENT_ID="$(python -c 'import uuid; print(uuid.uuid4())')"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "Deployment ID created for this workflow run."

      - name: Validate DEV Snowflake environment variables
        shell: bash
        run: |
          set -euo pipefail

          for variable in \
            SNOWFLAKE_ACCOUNT \
            SNOWFLAKE_USER \
            SNOWFLAKE_ROLE \
            SNOWFLAKE_WAREHOUSE
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::$variable is not configured in the GitHub DEV Environment."
              exit 1
            fi

            echo "$variable is configured"
          done

      - name: Verify DEV Schemachange configuration
        run: |
          schemachange verify \
            --config-file-name config/dev.yml

      - name: Preview pending DEV migrations
        run: |
          schemachange deploy \
            --config-file-name config/dev.yml \
            --dry-run

      - name: Mark DEV migration execution start
        if: success()
        shell: bash
        run: |
          echo "DEPLOYMENT_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ')" >> "$GITHUB_ENV"

      - name: Execute pending DEV migrations
        id: execute-dev-migrations
        if: success()
        run: |
          schemachange deploy \
            --config-file-name config/dev.yml

      - name: Record DEV deployment and migration audit in Snowflake
        if: always() && steps.write-dev-key.outputs.key_file_ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ENVIRONMENT: DEV
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_SOURCE_BRANCH: ${{ github.ref_name }}
          DEPLOYMENT_MODE: EXECUTE
          DEPLOYMENT_STATUS: ${{ job.status }}
          SCHEMACHANGE_CHANGE_HISTORY_TABLE: NAS_ADMIN.SCHEMACHANGE.CHANGE_HISTORY_DEV
        run: python write_deployment_audit.py

      - name: Clean up temporary private key
        if: always()
        shell: bash
        run: |
          if [[ -n "${SNOWFLAKE_PRIVATE_KEY_FILE:-}" && -f "$SNOWFLAKE_PRIVATE_KEY_FILE" ]]; then
            shred -u "$SNOWFLAKE_PRIVATE_KEY_FILE" || rm -f "$SNOWFLAKE_PRIVATE_KEY_FILE"
          fi
